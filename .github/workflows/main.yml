name: Deploy SQL via Fabric Notebook

on:
  push:
    branches: [dev]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      AZURE_CLIENT_ID: "580dfb7a-ccbd-422b-b214-f2470a0c9a7e"
      AZURE_TENANT_ID: "00ded8cc-141f-4cac-b015-a0c42b549fb9"
      AZURE_CLIENT_SECRET: "MgR8Q~_9GqEcAkexGcXyxIwmMlZpUZ85xnoCBaMf"
      WORKSPACE_ID: "4b58b49f-8f7d-46c9-8a1e-f1e347783e0a"
      ITEM_ID: "0f816928-23e5-4d3f-b0d5-5798ef5537c"

    steps:
      # ✅ Checkout repo
      - name: Checkout code
        uses: actions/checkout@v4

      # ✅ Azure Login (Service Principal)
      - name: Azure Login
        uses: azure/login@v2
        with:
          auth-type: SERVICE_PRINCIPAL
          creds: |
            {
              "clientId": "${{ env.AZURE_CLIENT_ID }}",
              "clientSecret": "${{ env.AZURE_CLIENT_SECRET }}",
              "tenantId": "${{ env.AZURE_TENANT_ID }}"
            }
          allow-no-subscriptions: true

      # ✅ Trigger Fabric Notebook
      - name: Trigger Fabric Notebook
        run: |
          echo "Getting Fabric access token..."

          ACCESS_TOKEN=$(az account get-access-token \
            --resource https://api.fabric.microsoft.com \
            --query accessToken -o tsv)

          echo "Triggering notebook run..."

          RESPONSE=$(curl -s -X POST \
            "https://api.fabric.microsoft.com/v1/workspaces/$WORKSPACE_ID/items/$ITEM_ID/jobs/instances?jobType=RunNotebook" \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            -H "Content-Type: application/json")

          echo "Response:"
          echo $RESPONSE

          echo "Notebook triggered successfully 🚀"
